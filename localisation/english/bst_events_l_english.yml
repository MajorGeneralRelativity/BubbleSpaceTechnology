 bst_survey.3.name: "Survey Complete!"
 bst_survey.3.desc: "Our science ship was surveying a frozen world when it detected an unusually regular series of voids buried under some of the snow and ice. Upon descending to investigate, our scientists and surveyors have uncovered what appears to be an abandoned installation constructed by an unknown alien race. While the ship cannot detect any thermal or electromagnetic signatures, the surveyors agree that a more detailed excavation by archaeologists is required."
 bst_species.06.title:0 "Dominant Species Set"
 bst_species.06.desc:0 "Our Empires dominant species has been set to §Y[uberspecies.GetName]§!"

 bst_species.10.title:0 "How Much?"
 bst_species.10.desc:0 "With the bodies prepared, a question arises: How many of our people should shed the limitations of flesh and embrace the cold perfection of metal?\n\nGame Note: This pop rebalance will happen 1 day after the main synth ascension/ascension situation - while the situation is ongoing 100% of pops & leaders will go to synth until the situation finishes.\n\n§RWarning:§! Synths cannot have biological traits, such as §MPsionic§!, §HCybernetic§! or §GErudite§!.  You should keep some biological pops if you want to take advantage of those."
 bst_species.10.0.synths:0 "§S100% synthetic, leaders go synthetic, synthetic authorities (Vanilla behaviour)§!"
 bst_species.10.25.synths:0 "§S75% synthetic, leaders go synthetic, synthetic authorities§!"
