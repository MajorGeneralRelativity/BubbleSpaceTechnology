 bst_species.11.title:0 "Apply Bio/Synth Pop Amounts"

 bst_species.20.title:0 "MORE Machine Ascension"
 bst_species.20.desc:0 "Because why be limited to 1 §Y$ap_synthetic_age$§! path when multiple exist?\n\nSelect the ones you haven't taken and it will auto-add the tradition for you as if you had completed the situation.\n\n§RSTRONGLY Recommend§! you take Modularity -> Nanites -> Virtual. \n\n§RWARNING§!:  Can cause instability! Nanite and Virtual are opposite playstyles"
 bst_species.20.desc.manytrads: "$bst_species.20.desc$\n\n§RWARNING:§!  §YThe vanilla game thinks you have filled all your tradition slots!§!  Unless you are using a mod that grants you more tradition slots (and has not properly overriden the slots variable) do not try to take another!"

 EVERYTHING_GOES_TO_SYTH:0 "We can assimilate basically everything into a synth"