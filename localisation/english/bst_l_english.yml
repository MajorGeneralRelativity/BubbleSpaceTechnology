 edict_bst_fix_leaders_desc:0 "Fixes leaders missing their species special biological or synth traits."

 edict_bst_fix_leader_species:0 "Fix Biological Leader Species"
 edict_bst_fix_leader_species_desc:0 "If §Y$edict_bst_fix_leaders$§! doesn't work, your existing leaders may be stuck as the wrong sub-species.\nYou need a main species pop that is §MPsionic§!, §HCybernetic§! and §GErudite§! then run this edict."

 edict_bst_bio_dominant:0 "Set Biological Species as Dominant"
 edict_bst_bio_dominant_desc:0 "After §Y$ap_synthetic_evolution$§!, sets a biological species template with §MPsionic§!, §HCybernetic§! and §GErudite§! as the empire dominant species (must have at least 1 pop with all 3 traits)"
 edict_bst_synth_dominant:0 "Set Synthetic Species as Dominant"
